<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Data Quality & Excel export tests</title><link rel="icon" href="data:,"></head><body><h1>Data Quality, reconciliation, and Excel export checks</h1><pre id="results">Running…</pre><iframe title="Dashboard under test" src="../index.html" style="width:375px;height:900px"></iframe><script>
document.querySelector('iframe').addEventListener('load',async function(){
 const d=this.contentDocument,w=this.contentWindow,results=[];let exported=null;
 const output=document.getElementById('results');
 const check=(condition,name)=>{if(!condition)throw Error(name);results.push('PASS: '+name);output.textContent=results.join('\n');};
 const wait=async condition=>{for(let i=0;i<200;i++){if(condition())return;await new Promise(r=>setTimeout(r,25));}throw Error('Timed out waiting for upload');};
 const change=(id,value)=>{d.getElementById(id).value=value;d.getElementById(id).dispatchEvent(new Event('change',{bubbles:true}));};
 const input=(id,value)=>{d.getElementById(id).value=value;d.getElementById(id).dispatchEvent(new Event('input',{bubbles:true}));};
 const upload=async(bytes,invalid=false)=>{const dt=new w.DataTransfer();dt.items.add(new w.File([bytes],'review.csv'));d.getElementById('ziwo-file').files=dt.files;d.getElementById('ziwo-file').dispatchEvent(new Event('change',{bubbles:true}));await wait(()=>invalid?!d.getElementById('ziwo-error').hidden:d.getElementById('ziwo-status').textContent.includes('5 original'));};
 try{
  const csv=await fetch('../samples/ziwo-inbound-sample.csv').then(r=>r.text());
  w.fetch=()=>{throw Error('Unexpected application network request');};w.XMLHttpRequest.prototype.send=()=>{throw Error('Unexpected application network request');};
  const create=w.URL.createObjectURL.bind(w.URL);w.URL.createObjectURL=blob=>{exported=blob;return create(blob);};
  const click=w.HTMLAnchorElement.prototype.click;w.HTMLAnchorElement.prototype.click=function(){if(this.download.endsWith('.xlsx'))return;return click.call(this);};
  await upload(csv);change('ziwo-from','2026-10-01');change('ziwo-through','2026-10-05');
  check(!d.getElementById('ziwo-quality').hidden,'Data Quality section visible');
  check(d.querySelectorAll('#quality-cards strong')[0].textContent==='2','Missing calendar dates counted');
  check(d.getElementById('quality-missing').textContent.includes('2026-10-03 → 2026-10-04'),'Missing dates identified');
  check(d.querySelectorAll('#quality-cards strong')[3].textContent==='1','Unusual real zero-SLA drop flagged');
  check(d.getElementById('quality-drops').textContent.includes('2026-10-02'),'Drop date identified');
  check(d.querySelectorAll('#performance-records tr').length===3,'Filtered daily table follows date range');
  check(d.querySelectorAll('#performance-records .target-breach').length===1,'SLA below 90% highlighted; exact 90% and 5% pass');
  change('performance-filter','attention');check(d.querySelectorAll('#performance-records tr').length===1&&d.getElementById('performance-records').textContent.includes('2026-10-02'),'Target-breach filter');
  d.getElementById('export-performance').click();check(exported&&exported.type.includes('spreadsheetml'),'Excel button creates XLSX Blob locally');
  let book=await w.ZiwoXlsx.readWorkbook(await exported.arrayBuffer()),sheet=await book.readSheet(0),settings=await book.readSheet(1);
  check(book.sheets.join(',')==='Daily Performance,Analysis Settings,Exclusion Approval Records','Official workbook has daily table, settings, and approval records');
  check(sheet.length===2&&sheet[1][0]==='2026-10-02','Excel export respects performance filter');
  check(sheet[1][4]===0&&sheet[1][7]===5&&sheet[1][9]===300,'Excel retains true zero SLA and numeric percentage/talk values');
  check(sheet[1][10]===''&&settings.some(row=>row[0]==='Full AHT'&&row[1].includes('Never estimated')),'Full AHT stays blank and explained in export');
  change('performance-filter','all');d.querySelector('[data-date="2026-10-02"]').click();d.getElementById('export-performance').click();
  book=await w.ZiwoXlsx.readWorkbook(await exported.arrayBuffer());sheet=await book.readSheet(0);settings=await book.readSheet(1);
  check(sheet.length===4&&sheet.slice(1).some(row=>row[0]==='2026-10-02'),'Official Excel retains proposed exclusion dates');
  check(settings.some(row=>row[0]==='Excluded Dates'&&row[1]==='None'),'Official export records no date exclusions');
  d.getElementById('ziwo-restore').click();const mismatch=w.Ziwo.parseCSV(csv);mismatch[3][2]='70%';await upload(mismatch.map(row=>row.join(',')).join('\n'));
  change('ziwo-from','2026-10-01');change('ziwo-through','2026-10-05');
  check(d.getElementById('reconciliation-summary').textContent.startsWith('1 significant'),'Significant SLA gap summary');
  check(d.getElementById('reconciliation-dates').textContent.includes('2026-10-02 (−70.00 pp)'),'Significant date and pp difference listed');
  check(d.getElementById('reconciliation-explanations').textContent.includes('Not explained by available count-based formulas'),'Unexplained gaps do not invent a cause');
  d.getElementById('show-discrepancies').click();check(d.getElementById('performance-filter').value==='discrepancies','Significant-date drilldown');
  const cells=d.querySelector('#performance-records tr').children;check(cells[4].textContent.includes('0.00%')&&cells[5].textContent==='70.00%'&&cells[6].textContent.includes('−70.00 pp'),'Daily table displays both SLA values and signed gap');
  input('sla-significant','71');check(d.getElementById('reconciliation-summary').textContent.startsWith('0 significant'),'Significance threshold updates results');input('sla-significant','1');
  change('performance-filter','all');input('target-abandonment','4');check(d.querySelectorAll('#performance-records .target-breach').length===3,'Abandonment above configured target highlighted');input('target-abandonment','5');
  const bad=w.Ziwo.parseCSV(csv);bad[1][1]='bad';bad[2][4]='bad';await upload(bad.map(row=>row.join(',')).join('\n'),true);
  check(d.querySelectorAll('#quality-cards strong')[2].textContent==='2','All invalid rows counted');
  check(d.getElementById('quality-issues').textContent.includes('Row 2')&&d.getElementById('quality-issues').textContent.includes('Row 3'),'Invalid row issues listed');
  check(d.getElementById('quality-invalid-source').textContent.includes('current valid analysis'),'Rejected upload and valid analysis scopes distinguished');
  check(d.querySelectorAll('#performance-records tr').length===3,'Rejected file preserves valid filtered table');
  await upload(csv);change('ziwo-from','2026-10-31');change('ziwo-through','2026-10-31');
  check(d.querySelectorAll('#quality-cards strong')[0].textContent==='0'&&d.querySelectorAll('#quality-cards strong')[1].textContent==='1','Known zero-call date is not missing');
  check(d.getElementById('export-performance').disabled,'Empty filtered table cannot export misleading data');
  change('ziwo-from','2026-11-01');check(d.getElementById('export-performance').disabled,'Invalid date range disables stale export');
  d.getElementById('ziwo-sample').click();change('ziwo-view','mtd');
  check(d.documentElement.scrollWidth<=375,'Review sections remain responsive on mobile');
  // Pagination: export all included rows, not only the current 50-row page.
  const raw=w.Ziwo.parseCSV(csv)[2],large=[w.Ziwo.COLUMNS,...Array.from({length:61},(_,i)=>{const row=raw.slice();row[0]=w.Ziwo.shiftDate('2026-01-01',i);return row;})].map(row=>row.join(',')).join('\n');
  change('ziwo-view','daily');const transfer=new w.DataTransfer();transfer.items.add(new w.File([large],'large.csv'));d.getElementById('ziwo-file').files=transfer.files;d.getElementById('ziwo-file').dispatchEvent(new Event('change',{bubbles:true}));await wait(()=>d.getElementById('ziwo-status').textContent.includes('61 original'));
  check(d.querySelectorAll('#performance-records tr').length===50,'Performance table paginates large reports');
  d.getElementById('performance-next').click();check(d.querySelectorAll('#performance-records tr').length===11,'Performance table second page');d.getElementById('export-performance').click();
  book=await w.ZiwoXlsx.readWorkbook(await exported.arrayBuffer());sheet=await book.readSheet(0);check(sheet.length===62,'Excel exports every filtered row across pages');
  output.textContent=results.join('\n')+`\nALL ${results.length} REVIEW CHECKS PASSED`;
 }catch(e){output.textContent=results.join('\n')+'\nFAIL: '+e.message;}
});
</script></body></html>
